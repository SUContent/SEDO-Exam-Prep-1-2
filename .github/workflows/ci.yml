name: CI Pipeline

on:
  push:
    branches:
      - develop
      - staging

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore SoftUniBazar.sln
      - name: Build solution
        run: dotnet build SoftUniBazar.sln --configuration Release --no-restore

  test:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Run tests
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "Running Unit Tests"
            dotnet test SoftUniBazar.Tests --configuration Release --no-build
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "Running Integration Tests"
            dotnet test SoftUniBazar.IntegrationTests --configuration Release --no-build
          fi 
